# 評価用の期待事項。実行時AIの出力から作らないこと（AIが提案した候補は review_status: unreviewed）。
# review_status: from_guide = 実装指示書の記載のみに基づく / human_reviewed = 評価担当者が資料を見て確認済み
review_status: from_guide
description: 複数の確認をまとめた3列・6行（粗い項目は必要に応じて分解）
expect:
  source_items: {min: 6, max: 6}
  cases: {min: 6}
  machine_validation: passed
