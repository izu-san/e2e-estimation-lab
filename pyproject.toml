[project]
name = "e2e-estimator"
version = "0.1.0"
description = "Excelテスト項目書からPlaywright自動化工数を見積もるハーネス（Claude Code Skill併用）"
requires-python = ">=3.11"
dependencies = [
    "openpyxl==3.1.5",
    "jsonschema==4.23.0",
    "PyYAML==6.0.2",
]

[project.scripts]
estimator = "estimator.cli:main"

[dependency-groups]
dev = ["pytest==8.3.4", "pillow==11.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estimator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
